name: assistant_pak
description: "Internal assistant app to call and SMS-remind patients about vaccination and follow-up appointments."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Third-party dependencies are added by scripts/setup.sh via `flutter pub add`
# so the resolved versions match the local Flutter SDK.
dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.2
  injectable: ^3.0.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdfrx: ^2.11.0
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
